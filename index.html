if(urlTableNo){try{localStorage.setItem('boboCartTableV1',urlTableNo)}catch(e){}}
const app=document.getElementById('app');
function money(n){return '$'+Number(n||0).toLocaleString('zh-TW')}
function save(){try{localStorage.setItem('boboCartV1',JSON.stringify(state.cart));if(urlTableNo)localStorage.setItem('boboCartTableV1',urlTableNo)}catch(e){}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function cartCount(){return state.cart.reduce((s,x)=>s+x.qty,0)} function cartTotal(){return state.cart.reduce((s,x)=>s+x.unit*x.qty,0)}
function topbar(back=false,title='') {return `<div class="topbar">${back?`<button class="iconbtn" onclick="goBack()">←</button>`:''}<div class="brand"><h1>${title||'波波草早午餐'}</h1>${title?'':`<small>BoboCao Breakfast & Brunch</small>`}</div><button class="iconbtn" onclick="showCart()">🛒</button></div>`}
function cartbar(){return `<div class="cartbar"><button class="primary" onclick="showCart()"><span>🛒 購物車 <span class="badge">${cartCount()}</span></span><span>${money(cartTotal())}</span></button></div>`}
function home(){return `${topbar()}<div class="hero"><h2>美好的一天，從早餐開始</h2><p>掃碼點餐・免下載 App</p></div><div class="section"><h3>菜單分類</h3><div class="grid">${CATEGORIES.map(c=>`<button class="cat" onclick='showCategory(${JSON.stringify(c[0])})'><span class="ico">${c[1]}</span><span>${c[0]}</span></button>`).join('')}</div></div>${cartbar()}`}
function itemPriceLabel(i){if(i.variants){const vals=Object.values(i.variants);return vals.length?money(Math.min(...vals))+' 起':'價格待補'}return money(i.price)}
function categoryPage(){const list=allItems.filter(i=>i.category===state.category);return `${topbar(true,state.category)}<div class="page-title"><h2>${state.category}</h2><p>點商品可選規格與數量</p></div><div class="list">${list.map(i=>{const unavailable=i.variants&&Object.keys(i.variants).length===0;const s=special[i.sku]||{};return `<div class="item ${unavailable?'disabled':''}"><div class="item-main" onclick="${unavailable?'':`selectItem('${i.sku}')`}"><div class="item-name">${i.name}</div><div class="item-sub">${i.pending||s.note||''}</div></div><div class="price">${itemPriceLabel(i)}</div><button class="plus" ${unavailable?'disabled':''} onclick="${unavailable?'':`selectItem('${i.sku}')`}">+</button></div>`}).join('')}</div>${cartbar()}`}
function selectItem(sku){state.selected=allItems.find(i=>i.sku===sku);state.view='detail';state.qty=1;state.addons=new Set();state.condiments=new Set();state.choice=null;state.mealDrink=null;state.drinkVariant=null;if(state.selected.variants){const keys=Object.keys(state.selected.variants);if(keys.length)state.drinkVariant=keys[0]}const sp=special[sku];if(sp?.choice?.options?.length){state.choice=sp.choice.title.startsWith('套餐加購')?null:sp.choice.options[0][0]}render()}
function currentUnit(){const i=state.selected;if(!i)return 0;if(i.variants)return i.variants[state.drinkVariant]||0;let p=i.price;const sp=special[i.sku]||{};if(sp.choice&&state.choice){const o=sp.choice.options.find(x=>x[0]===state.choice);if(o)p+=o[1]}if(sp.mealDrink&&state.choice&&state.mealDrink){const md=mealDrinkByKey(state.mealDrink);if(md)p+=md.surcharge}if(sp.addons){sp.addons.forEach(a=>{if(state.addons.has(a[0]))p+=a[1]})}return p}
function detailPage(){const i=state.selected,sp=special[i.sku]||{};let options='';if(i.variants){options+=`<div class="group"><h4>規格</h4>${Object.entries(i.variants).map(([k,v])=>`<div class="opt"><label><input type="radio" name="drink" ${state.drinkVariant===k?'checked':''} onchange="setDrink('${k}')">${k}</label><strong> ${money(v)}</strong></div>`).join('')}${i.pending?`<div class="item-sub">${i.pending}</div>`:''}</div>`}if(sp.addons){options+=`<div class="group"><h4>加購選項（可複選）</h4>${sp.addons.map(a=>`<div class="opt"><label><input type="checkbox" ${state.addons.has(a[0])?'checked':''} onchange="toggleAddon('${a[0]}')">${a[0]}</label><strong>+${money(a[1]).slice(1)}</strong></div>`).join('')}</div>`}if(sp.condiments){options+=`<div class="group"><h4>醬料／調味（可複選）</h4>${sp.condiments.map(c=>`<div class="opt"><label><input type="checkbox" ${state.condiments.has(c)?'checked':''} onchange="toggleCondiment('${c}')">${c}</label><strong>免費</strong></div>`).join('')}</div>`}if(sp.choice){options+=`<div class="group"><h4>${sp.choice.title}</h4>${sp.choice.options.map(o=>`<div class="opt"><label><input type="radio" name="choice" ${state.choice===o[0]?'checked':''} onchange='setChoice(${JSON.stringify(o[0])})'>${o[0]}</label><strong>${o[1]?('+'+money(o[1]).slice(1)):'$0'}</strong></div>`).join('')}</div>`}if(sp.mealDrink&&state.choice){if(!state.mealDrink&&mealDrinkOptions.length)state.mealDrink=mealDrinkOptions[0].key;options+=`<div class="group"><h4>${sp.mealDrink.title}</h4><div class="field"><select id="mealDrinkSelect" onchange="setMealDrink(this.value)">${mealDrinkOptions.map(o=>`<option value="${o.key}" ${state.mealDrink===o.key?'selected':''}>${mealDrinkLabel(o)}</option>`).join('')}</select></div><div class="item-sub">20 元飲料不加價；超過 20 元只補差額。</div></div>`}return `${topbar(true,'商品詳情')}<div class="detail"><div class="detail-head"><div class="detail-title"><h2>${i.name}</h2><div class="detail-price">${money(currentUnit())}</div></div><div class="item-sub">${sp.note||i.pending||'依現場菜單資料建立'}</div></div>${options}<div class="group"><h4>數量</h4><div class="qty"><button onclick="qty(-1)">−</button><strong>${state.qty}</strong><button onclick="qty(1)">＋</button></div></div><button class="primary" onclick="addCart()">加入購物車・${money(currentUnit()*state.qty)}</button></div>${cartbar()}`}
function cartPage(){if(!state.cart.length)return `${topbar(true,'購物車')}<div class="empty">購物車目前沒有商品</div><div class="section"><button class="secondary" onclick="homeGo()">返回菜單</button></div>`;return `${topbar(true,'購物車')}<div class="cart">${state.cart.map((x,idx)=>`<div class="cart-card"><div class="cart-row"><div><h4>${x.name}</h4><div class="cart-meta">${x.meta||''}</div></div><strong class="price">${money(x.unit*x.qty)}</strong></div><div class="cart-actions"><button class="linkbtn" onclick="removeCart(${idx})">刪除</button><div class="qty"><button onclick="cartQty(${idx},-1)">−</button><strong>${x.qty}</strong><button onclick="cartQty(${idx},1)">＋</button></div></div></div>`).join('')}<div class="field"><label>備註</label><textarea id="orderNote" placeholder="例如：不要洋蔥、醬另外裝…"></textarea></div><div class="field"><label>桌號</label><input id="tableNo" inputmode="numeric" value="${urlTableNo}" ${urlTableNo?'readonly':''} placeholder="請輸入桌號（可不填）"></div>${urlTableNo?`<div class="item-sub">已由桌上 QR Code 自動辨識：${urlTableNo} 號桌</div>`:''}<div class="totalbox"><div class="totalrow"><span>小計</span><strong>${money(cartTotal())}</strong></div><div class="totalrow grand"><span>總計</span><span>${money(cartTotal())}</span></div></div><button class="primary" onclick="submitOrder()">送出訂單 →</button></div>`}
function render(){app.innerHTML=state.view==='home'?home():state.view==='category'?categoryPage():state.view==='detail'?detailPage():cartPage()}
function showCategory(c){state.category=c;state.view='category';render();window.scrollTo(0,0)} function showCart(){state.view='cart';render();window.scrollTo(0,0)} function homeGo(){state.view='home';render();window.scrollTo(0,0)}
function goBack(){if(state.view==='category')state.view='home';else if(state.view==='detail')state.view='category';else if(state.view==='cart')state.view=state.category?'category':'home';render();window.scrollTo(0,0)}
function qty(d){state.qty=Math.max(1,state.qty+d);render()} function setChoice(v){state.choice=v;const sp=special[state.selected?.sku]||{};if(sp.mealDrink&&v&&!state.mealDrink&&mealDrinkOptions.length)state.mealDrink=mealDrinkOptions[0].key;render()} function setMealDrink(v){state.mealDrink=v;render()} function setDrink(v){state.drinkVariant=v;render()} function toggleAddon(v){state.addons.has(v)?state.addons.delete(v):state.addons.add(v);render()} function toggleCondiment(v){state.condiments.has(v)?state.condiments.delete(v):state.condiments.add(v);render()}
function addCart(){const i=state.selected;if(i.variants&&!state.drinkVariant)return toast('請先選擇飲料規格');let meta=[];if(i.variants)meta.push(state.drinkVariant);const sp=special[i.sku]||{};if(sp.choice&&state.choice&&state.choice!=='原設定'){meta.push(state.choice);if(sp.mealDrink){const md=mealDrinkByKey(state.mealDrink);if(!md)return toast('請先選擇套餐飲料');meta.push('套餐飲料：'+mealDrinkLabel(md));}}if(sp.addons)sp.addons.forEach(a=>{if(state.addons.has(a[0]))meta.push(a[0])});if(sp.condiments)sp.condiments.forEach(c=>{if(state.condiments.has(c))meta.push(c)});state.cart.push({sku:i.sku,name:i.name,unit:currentUnit(),qty:state.qty,meta:meta.join('／')});save();toast('已加入購物車');render()}
function removeCart(i){state.cart.splice(i,1);save();render()} function cartQty(i,d){state.cart[i].qty=Math.max(1,state.cart[i].qty+d);save();render()}
function submitOrder(){const table=document.getElementById('tableNo')?.value?.trim()||urlTableNo||'';const note=document.getElementById('orderNote')?.value?.trim()||'';toast(`送單接口尚未串接${table?'・桌號 '+table:''}${note?'・已保留備註':''}`)}
submitOrder=async function(){const table=document.getElementById('tableNo')?.value?.trim()||urlTableNo||'',note=document.getElementById('orderNote')?.value?.trim()||'';try{toast('訂單送出中…');await fetch('https://script.google.com/macros/s/AKfycbyPxy0qAwmmi-J-48N4nXY2383jzHHm50MyjnRTVspkEXCpbaoNyaiFuDjyT5UM7kmOUw/exec',{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tableNo:table,note:note,total:cartTotal(),items:state.cart})});state.cart=[];save();state.view='home';state.category=null;state.selected=null;state.qty=1;state.choice=null;state.mealDrink=null;state.addons=new Set();state.condiments=new Set();state.drinkVariant=null;render();window.scrollTo(0,0);toast('訂單已送出'+(table?'・'+table+'號桌':''))}catch(e){toast('送單失敗，請再試一次')}}
CATEGORIES.forEach(c=>{if(c[0]==='輕吐司／乳酪餅')c[0]='清吐司／乳酪餅'});
allItems.forEach(i=>{if(i.category==='輕吐司／乳酪餅')i.category='清吐司／乳酪餅'});
['D001','D002','D003','D004','D005','D006','D007','D008'].forEach(s=>{
  const sp=special[s],i=allItems.find(x=>x.sku===s);
  if(sp?.choice){
    sp.choice.options=sp.choice.options.map(([n,p])=>[n==='輕吐司'?'清吐司':n,p]);
    sp.note=`清吐司 $${i.price}／乳酪餅 $${i.price+10}`;
  }
});
special.D009={...(special.D009||{}),note:'乳酪餅限定'};
special.D010={...(special.D010||{}),note:'乳酪餅限定'};
  render();
</script>
</body>
</html>
