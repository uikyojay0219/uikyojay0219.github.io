let state={view:fixedTableNo?'home':'service',orderType:fixedTableNo?'dinein':null,tableNo:fixedTableNo,category:null,selected:null,qty:1,choice:null,mealDrink:null,addons:new Set(),condiments:new Set(),drinkVariant:null,drinkSugar:null,portion:null,method:null,soldOutSkus:new Set(),cart:loadCart()};
const A_TOAST_ONLY_SKUS=new Set(['A010','A012']);

const app=document.getElementById('app');

function topbar(back=false,title='') {return `<div class="topbar">${back?`<button class="iconbtn" onclick="goBack()">←</button>`:''}<div class="brand"><h1>${title||'波波草早午餐'}</h1>${title?'':`<small>BoboCao Breakfast & Brunch</small>`}</div><button class="iconbtn" onclick="showCart()">🛒</button></div>`}

function categoryPage(){const list=allItems.filter(i=>i.category===state.category);return `${topbar(true,state.category)}<div class="page-title"><h2>${state.category}</h2><p>點商品可選規格與數量</p></div><div class="list">${list.map(i=>{const soldOut=isItemFullySoldOut(i);const unavailable=soldOut||(i.variants&&Object.keys(i.variants).length===0);const s=special[i.sku]||{};const availability=aAvailabilityText(i);return `<div class="item ${unavailable?'disabled':''}"><div class="item-main" onclick="${unavailable?'':`selectItem('${i.sku}')`}"><div class="item-name">${i.name}${soldOut?'<span class="soldout-label">今日售完</span>':''}</div><div class="item-sub">${soldOut?'今日售完，暫停點餐':(availability||i.pending||s.note||'')}</div></div><div class="price">${soldOut?'今日售完':itemPriceLabel(i)}</div><button class="plus" ${unavailable?'disabled':''} onclick="${unavailable?'':`selectItem('${i.sku}')`}">+</button></div>`}).join('')}</div>${cartbar()}`}
function selectItem(sku){state.selected=allItems.find(i=>i.sku===sku);if(!state.selected)return;if(isItemFullySoldOut(state.selected)){state.selected=null;return toast('此商品今日售完')}state.view='detail';state.qty=1;state.addons=new Set();state.condiments=new Set();state.choice=null;state.mealDrink=null;state.drinkVariant=null;state.drinkSugar=null;state.portion=null;state.method=null;if(isAItem(state.selected)&&!A_TOAST_ONLY_SKUS.has(state.selected.sku)&&isATypeSoldOut(state.selected,'吐司')&&!isATypeSoldOut(state.selected,'漢堡'))state.addons.add('漢堡');if(state.selected.variants){const keys=Object.keys(state.selected.variants);if(keys.length)state.drinkVariant=keys[0]}const sp=special[sku];if(sp?.choice?.options?.length){state.choice=sp.choice.title.startsWith('套餐加購')?null:sp.choice.options[0][0]}render()}
function currentUnit(){const i=state.selected;if(!i)return 0;if(i.variants)return i.variants[state.drinkVariant]||0;let p=i.price;const sp=special[i.sku]||{};if(sp.portion){if(state.portion){const o=sp.portion.options.find(x=>x[0]===state.portion);if(o)p=Number(o[1])}else if(sp.portion.options?.length){p=Math.min(...sp.portion.options.map(x=>Number(x[1])||0))}}if(sp.choice&&state.choice){const o=sp.choice.options.find(x=>x[0]===state.choice);if(o)p+=o[1]}if(sp.mealDrink&&state.choice&&state.mealDrink){const md=mealDrinkByKey(state.mealDrink);if(md)p+=md.surcharge}if(sp.addons){sp.addons.forEach(a=>{if(state.addons.has(a[0]))p+=a[1]})}return p}
function addonOptionHtml(i,a){const isBurger=isAItem(i)&&a[0]==='漢堡';const burgerSold=isBurger&&isATypeSoldOut(i,'漢堡');const burgerForced=isBurger&&isATypeSoldOut(i,'吐司')&&!burgerSold;const disabled=burgerSold||burgerForced;const checked=state.addons.has(a[0]);const label=burgerSold?'漢堡（今日售完）':(burgerForced?'漢堡（吐司售完，目前僅供應漢堡）':a[0]);return `<div class="opt"><label><input type="checkbox" ${checked?'checked':''} ${disabled?'disabled':''} onchange='toggleAddon(${JSON.stringify(a[0])})'>${label}</label><strong>+${money(a[1]).slice(1)}</strong></div>`}
function detailPage(){const i=state.selected,sp=special[i.sku]||{};let options='';if(i.variants){options+=`<div class="group"><h4>規格</h4>${Object.entries(i.variants).map(([k,v])=>`<div class="opt"><label><input type="radio" name="drink" ${state.drinkVariant===k?'checked':''} onchange="setDrink('${k}')">${k}</label><strong> ${money(v)}</strong></div>`).join('')}${i.pending?`<div class="item-sub">${i.pending}</div>`:''}</div><div class="group"><h4>糖度</h4>${['有糖','無糖'].map(v=>`<div class="opt"><label><input type="radio" name="sugar" ${state.drinkSugar===v?'checked':''} onchange="setSugar('${v}')">${v}</label><strong>$0</strong></div>`).join('')}</div>`}if(sp.portion){options+=`<div class="group"><h4>${sp.portion.title}</h4>${sp.portion.options.map(o=>`<div class="opt"><label><input type="radio" name="portion" ${state.portion===o[0]?'checked':''} onchange='setPortion(${JSON.stringify(o[0])})'>${o[0]}</label><strong>${money(o[1])}</strong></div>`).join('')}</div>`}if(sp.method){options+=`<div class="group"><h4>${sp.method.title}</h4>${sp.method.options.map(v=>`<div class="opt"><label><input type="radio" name="method" ${state.method===v?'checked':''} onchange='setMethod(${JSON.stringify(v)})'>${v}</label><strong>$0</strong></div>`).join('')}</div>`}if(sp.addons){options+=`<div class="group"><h4>加購選項（可複選）</h4>${sp.addons.map(a=>addonOptionHtml(i,a)).join('')}</div>`}if(sp.condiments){options+=`<div class="group"><h4>醬料／調味（可複選）</h4>${sp.condiments.map(c=>`<div class="opt"><label><input type="checkbox" ${state.condiments.has(c)?'checked':''} onchange="toggleCondiment('${c}')">${c}</label><strong>免費</strong></div>`).join('')}</div>`}if(sp.choice){options+=`<div class="group"><h4>${sp.choice.title}</h4>${sp.choice.options.map(o=>`<div class="opt"><label><input type="radio" name="choice" ${state.choice===o[0]?'checked':''} onchange='setChoice(${JSON.stringify(o[0])})'>${o[0]}</label><strong>${o[1]?('+'+money(o[1]).slice(1)):'$0'}</strong></div>`).join('')}</div>`}if(sp.mealDrink&&state.choice){if(!state.mealDrink&&mealDrinkOptions.length)state.mealDrink=mealDrinkOptions[0].key;options+=`<div class="group"><h4>${sp.mealDrink.title}</h4><div class="field"><select id="mealDrinkSelect" onchange="setMealDrink(this.value)">${mealDrinkOptions.map(o=>`<option value="${o.key}" ${state.mealDrink===o.key?'selected':''}>${mealDrinkLabel(o)}</option>`).join('')}</select></div><div class="item-sub">20 元飲料不加價；超過 20 元只補差額。</div></div>`}return `${topbar(true,'商品詳情')}<div class="detail"><div class="detail-head"><div class="detail-title"><h2>${i.name}</h2><div class="detail-price">${money(currentUnit())}</div></div><div class="item-sub">${aAvailabilityText(i)||sp.note||i.pending||'依現場菜單資料建立'}</div></div>${options}<div class="group"><h4>數量</h4><div class="qty"><button onclick="qty(-1)">−</button><strong>${state.qty}</strong><button onclick="qty(1)">＋</button></div></div><button class="primary" onclick="addCart()">加入購物車・${money(currentUnit()*state.qty)}</button></div>${cartbar()}`}
function cartPage(){if(!state.cart.length)return `${topbar(true,'購物車')}<div class="empty">購物車目前沒有商品</div><div class="section"><button class="secondary" onclick="homeGo()">返回菜單</button></div>`;const orderLabel=state.orderType==='takeout'?'🥡 外帶':`🍽️ 內用・${tableDisplayName(state.tableNo)}`;return `${topbar(true,'購物車')}<div class="cart"><div class="order-summary">本次訂單：<strong>${orderLabel}</strong></div>${state.cart.map((x,idx)=>`<div class="cart-card"><div class="cart-row"><div><h4>${x.name}</h4><div class="cart-meta">${x.meta||''}</div></div><strong class="price">${money(x.unit*x.qty)}</strong></div><div class="cart-actions"><button class="linkbtn" onclick="removeCart(${idx})">刪除</button><div class="qty"><button onclick="cartQty(${idx},-1)">−</button><strong>${x.qty}</strong><button onclick="cartQty(${idx},1)">＋</button></div></div></div>`).join('')}<div class="field"><label>備註</label><textarea id="orderNote" placeholder="例如：不要洋蔥、醬另外裝…"></textarea></div><div class="totalbox"><div class="totalrow"><span>小計</span><strong>${money(cartTotal())}</strong></div><div class="totalrow grand"><span>總計</span><span>${money(cartTotal())}</span></div></div><button class="primary" onclick="submitOrder()">送出訂單 →</button></div>`}

function render(){app.innerHTML=state.view==='service'?servicePage():state.view==='table'?tablePage():state.view==='home'?home():state.view==='category'?categoryPage():state.view==='detail'?detailPage():cartPage()}
function chooseOrderType(type){state.orderType=type;if(type==='takeout'){state.tableNo='';state.view='home'}else{state.tableNo='';state.view='table'}render();window.scrollTo(0,0)}
function chooseTable(n){state.orderType='dinein';state.tableNo=String(n);state.view='home';save();render();window.scrollTo(0,0)}
function changeOrderType(){if(fixedTableNo){state.orderType='dinein';state.tableNo=fixedTableNo;state.view='home';render();return}state.view='service';render();window.scrollTo(0,0)}
function showCategory(c){if(!state.orderType)return changeOrderType();state.category=c;state.view='category';render();loadSoldOutStatus();window.scrollTo(0,0)} function showCart(){if(!state.orderType)return changeOrderType();state.view='cart';render();window.scrollTo(0,0)} function homeGo(){state.view=state.orderType?'home':'service';render();window.scrollTo(0,0)}
function goBack(){if(state.view==='table')state.view='service';else if(state.view==='category')state.view='home';else if(state.view==='detail')state.view='category';else if(state.view==='cart')state.view=state.category?'category':'home';render();window.scrollTo(0,0)}
function qty(d){state.qty=Math.max(1,state.qty+d);render()} function setChoice(v){state.choice=v;const sp=special[state.selected?.sku]||{};if(sp.mealDrink&&v&&!state.mealDrink&&mealDrinkOptions.length)state.mealDrink=mealDrinkOptions[0].key;render()} function setMealDrink(v){state.mealDrink=v;render()} function setDrink(v){state.drinkVariant=v;render()} function setSugar(v){state.drinkSugar=v;render()} function setPortion(v){state.portion=v;render()} function setMethod(v){state.method=v;render()} function toggleAddon(v){const i=state.selected;if(isAItem(i)&&v==='漢堡'){if(isATypeSoldOut(i,'漢堡'))return toast('漢堡今日售完');if(isATypeSoldOut(i,'吐司')&&state.addons.has('漢堡'))return toast('吐司今日售完，目前只能選漢堡')}state.addons.has(v)?state.addons.delete(v):state.addons.add(v);render()} function toggleCondiment(v){state.condiments.has(v)?state.condiments.delete(v):state.condiments.add(v);render()}
function cartItemName(i){if(i.category==='蛋餅')return i.name.endsWith('蛋餅')?i.name:i.name+'蛋餅';if(i.category==='蔥抓餅＋蛋'){if(i.name.includes('抓餅'))return i.name+'＋蛋';return i.name+'蔥抓餅＋蛋'}if(i.category==='吐司／漢堡'){if(i.name.includes('吐司'))return i.name;return i.name+(state.addons.has('漢堡')?'漢堡':'吐司')}if(i.category==='清吐司／乳酪餅'){if(state.choice)return i.name+state.choice;if(i.sku==='D009'||i.sku==='D010')return i.name+'乳酪餅'}return i.name}
function addCart(){const i=state.selected;if(!i)return;if(isItemFullySoldOut(i))return toast('此商品今日售完');const aType=selectedAType(i);if(aType&&isATypeSoldOut(i,aType))return toast(aType+'今日售完');if(i.variants&&!state.drinkVariant)return toast('請先選擇飲料規格');if(i.variants&&!state.drinkSugar)return toast('請先選擇糖度');const sp=special[i.sku]||{};if(sp.portion?.required&&!state.portion)return toast('請先選擇份量');if(sp.method?.required&&!state.method)return toast('請先選擇做法');let meta=[];if(i.variants){meta.push(state.drinkVariant);meta.push(state.drinkSugar)}if(sp.portion&&state.portion)meta.push(state.portion);if(sp.method&&state.method)meta.push(state.method);if(sp.choice&&state.choice&&state.choice!=='原設定'){if(i.category!=='清吐司／乳酪餅')meta.push(state.choice);if(sp.mealDrink){const md=mealDrinkByKey(state.mealDrink);if(!md)return toast('請先選擇套餐飲料');meta.push('套餐飲料：'+mealDrinkLabel(md));}}if(sp.addons)sp.addons.forEach(a=>{if(state.addons.has(a[0])&&!(i.category==='吐司／漢堡'&&a[0]==='漢堡'))meta.push(a[0])});if(sp.condiments)sp.condiments.forEach(c=>{if(state.condiments.has(c))meta.push(c)});state.cart.push({sku:i.sku,name:cartItemName(i),unit:currentUnit(),qty:state.qty,meta:meta.join('／')});save();state.view='category';state.selected=null;state.qty=1;render();window.scrollTo(0,0);toast('已加入購物車')}
function removeCart(i){state.cart.splice(i,1);save();render()} function cartQty(i,d){state.cart[i].qty=Math.max(1,state.cart[i].qty+d);save();render()}
function submitOrder(){const orderRef=state.orderType==='takeout'?'外帶':state.tableNo;const note=document.getElementById('orderNote')?.value?.trim()||'';toast(`送單接口尚未串接・${state.orderType==='takeout'?'外帶':state.tableNo+'桌'}${note?'・已保留備註':''}`)}
submitOrder=async function(){if(!state.orderType)return toast('請先選擇內用或外帶');if(state.orderType==='dinein'&&!state.tableNo)return toast('請先選擇桌號');const orderRef=state.orderType==='takeout'?'外帶':normalizeTableNo(state.tableNo),note=document.getElementById('orderNote')?.value?.trim()||'';try{toast('訂單送出中…');await fetch(ORDER_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tableNo:orderRef,note:note,total:cartTotal(),items:state.cart})});state.cart=[];save();state.view=fixedTableNo?'home':'service';state.orderType=fixedTableNo?'dinein':null;state.tableNo=fixedTableNo||'';state.category=null;state.selected=null;state.qty=1;state.choice=null;state.mealDrink=null;state.addons=new Set();state.condiments=new Set();state.drinkVariant=null;state.drinkSugar=null;state.portion=null;state.method=null;render();window.scrollTo(0,0);toast('訂單已送出・'+(orderRef==='外帶'?'外帶':tableDisplayName(orderRef)))}catch(e){toast('送單失敗，請再試一次')}}

function loadSoldOutStatus(){
  const cb='__boboMenuStatus_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const script=document.createElement('script');
  let done=false;
  const cleanup=()=>{if(done)return;done=true;try{delete window[cb]}catch(e){};script.remove()};
  window[cb]=payload=>{const arr=Array.isArray(payload?.soldOutSkus)?payload.soldOutSkus:[];state.soldOutSkus=new Set(arr.map(String));if(state.view==='category')render();cleanup()};
  script.onerror=cleanup;
  script.src=ORDER_API_URL+'?action=menuStatus&callback='+encodeURIComponent(cb)+'&t='+Date.now();
  document.head.appendChild(script);
  setTimeout(cleanup,8000);
}

  }
});
special.D009={...(special.D009||{}),note:'乳酪餅限定'};
